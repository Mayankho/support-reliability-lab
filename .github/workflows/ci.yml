name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Validate dataset integrity
        run: pnpm eval:validate-data

      - name: Validate issue taxonomy and check the coverage crosswalk is current
        run: |
          pnpm tickets:validate-taxonomy
          pnpm tickets:coverage -- --check

  integration:
    name: Postgres integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: support_reliability
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d support_reliability"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/support_reliability
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/support_reliability
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed synthetic data
        run: pnpm seed

      - name: Integration tests
        run: pnpm test:integration

      - name: Release gate for reference-v1 (fails the job on BLOCK or ERROR)
        run: pnpm eval:run -- --agent reference-v1 --out artifacts/ci/reference-v1

      - name: Demo (fails unless it observes PASS, BLOCK, PASS)
        run: pnpm demo

      - name: Alert check (fails while any alert is open)
        run: pnpm alerts:check

      - name: Ticket triage demo on invented conversations (fails on any leak)
        run: pnpm tickets:demo

      - name: Scan tracked files and generated artifacts for sensitive values
        id: sensitive-scan
        if: always() && !cancelled()
        run: pnpm scan:sensitive > "$RUNNER_TEMP/sensitive-scan.txt"

      - name: Show sensitive-scan summary
        if: always() && !cancelled()
        run: |
          if [ -f "$RUNNER_TEMP/sensitive-scan.txt" ]; then
            cat "$RUNNER_TEMP/sensitive-scan.txt"
          fi

      - name: Upload evaluation artifacts
        if: steps.sensitive-scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload scrubbed scan summary
        if: always() && !cancelled() && steps.sensitive-scan.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: sensitive-scan-summary
          path: ${{ runner.temp }}/sensitive-scan.txt
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Review UI end-to-end (Playwright)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: support_reliability
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d support_reliability"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://app:app@localhost:5432/srl_e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @srl/web exec playwright install --with-deps chromium

      - name: Build UI, prepare data, run browser tests
        run: pnpm --filter @srl/web test:e2e

      - name: Scan before publishing the browser report
        id: sensitive-scan
        if: always() && !cancelled()
        run: pnpm scan:sensitive -- apps/web/playwright-report > "$RUNNER_TEMP/sensitive-scan.txt"

      - name: Show sensitive-scan summary
        if: always() && !cancelled()
        run: |
          if [ -f "$RUNNER_TEMP/sensitive-scan.txt" ]; then
            cat "$RUNNER_TEMP/sensitive-scan.txt"
          fi

      - name: Upload Playwright report
        if: steps.sensitive-scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload scrubbed scan summary
        if: always() && !cancelled() && steps.sensitive-scan.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-sensitive-scan-summary
          path: ${{ runner.temp }}/sensitive-scan.txt
          if-no-files-found: ignore
          retention-days: 14
